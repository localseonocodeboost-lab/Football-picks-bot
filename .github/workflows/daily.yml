name: Daily picks

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run bot
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          cd football-picks-bot
          python run.py
      - name: Publish dashboard to root /docs
        run: |
          mkdir -p docs
          cp football-picks-bot/docs/index.html docs/index.html
          touch docs/.nojekyll
      - name: Commit results
        run: |
          git config user.name "picks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add football-picks-bot/data docs
          git diff --cached --quiet || git commit -m "Daily picks $(date -u +%F)"
          git push
